pluginManagement {
    repositories {
        // Tencent Cloud mirror first, so plugin resolution stays fast in mainland China.
        maven { url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0'
}

rootProject.name = 'crashsuperpro'
